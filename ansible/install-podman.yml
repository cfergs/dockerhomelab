---
- name: Install rootless Podman and dockhand on Debian
  hosts: host
  become: true
  gather_facts: true

  vars:
    dockhand_image: docker.io/fnsys/dockhand:v1.0.58
    dockhand_domain: dockhand.chickenwaffles.net
    podman_user: "{{ ansible_user }}"

  tasks:
    - name: Require Debian
      ansible.builtin.assert:
        that:
          - ansible_facts.os_family == "Debian"
        fail_msg: "This playbook only supports Debian-based hosts."

    - name: Update apt cache and install Podman
      ansible.builtin.apt:
        name: podman
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Allow rootless Podman to bind to ports 80 and 443
      ansible.builtin.copy:
        dest: /etc/sysctl.d/99-rootless-podman.conf
        content: |
          net.ipv4.ip_unprivileged_port_start=80
        owner: root
        group: root
        mode: "0644"
      register: podman_sysctl

    - name: Reload sysctl settings
      ansible.builtin.command: sysctl --system
      when: podman_sysctl is changed
      changed_when: true

    - name: Show installed Podman version
      ansible.builtin.command: podman --version
      register: podman_version
      changed_when: false

    - name: Report Podman version
      ansible.builtin.debug:
        msg: "{{ podman_version.stdout }}"

    - name: Get the rootless Podman user's UID
      ansible.builtin.command: id -u "{{ podman_user }}"
      register: podman_uid_cmd
      changed_when: false

    - name: Set rootless Podman facts
      ansible.builtin.set_fact:
        podman_uid: "{{ podman_uid_cmd.stdout | trim }}"
        podman_socket_path: "/run/user/{{ podman_uid_cmd.stdout | trim }}/podman/podman.sock"

    - name: Create data directory
      ansible.builtin.file:
        path: /data
        state: directory
        #owner: "{{ podman_user }}"
        #group: "{{ podman_user }}"
        owner:
        mode: "0755"

    - name: Ensure data tree is owned by the rootless user
      ansible.builtin.file:
        path: /data
        state: directory
        owner: "{{ podman_user }}"
        group: "{{ podman_user }}"
        recurse: true

    - name: Create shared Podman directory
      ansible.builtin.file:
        path: /opt/podman
        state: directory
        owner: "{{ podman_user }}"
        group: "{{ podman_user }}"
        mode: "0755"

    - name: Create secrets directory for docker
      ansible.builtin.file:
        path: /opt/secrets
        state: directory
        owner: "{{ podman_user }}"
        group: "{{ podman_user }}"
        mode: "0700"

    - name: Ensure secret files are restricted to the rootless user
      ansible.builtin.file:
        path: "/opt/secrets/{{ item }}"
        owner: "{{ podman_user }}"
        group: "{{ podman_user }}"
        mode: "0600"
      loop:
        - openvpn-credentials.txt
      ignore_errors: true

    # Podman perms are odd, just go with it until i know more
    - name: Podman Unshare to change ownership of /opt/podman to the rootless user
      ansible.builtin.command: podman unshare chown -R {{ podman_user }}:{{ podman_user }} /opt/podman
      become: true
      become_user: "{{ podman_user }}"

    - name: Podman Unshare to change ownership of /data to the rootless user
      ansible.builtin.command: podman unshare chown -R {{ podman_user }}:{{ podman_user }} /data
      become: true
      become_user: "{{ podman_user }}"

    - name: Enable lingering for the rootless user
      ansible.builtin.command: loginctl enable-linger "{{ podman_user }}"
      args:
        creates: "/var/lib/systemd/linger/{{ podman_user }}"

    - name: Rootless Podman setup and dockhand
      become: true
      become_user: "{{ podman_user }}"
      block:
        - name: Mask the package-provided user-scoped Podman restart service
          ansible.builtin.systemd:
            scope: user
            name: podman-restart.service
            state: stopped
            masked: true
            daemon_reload: true

        - name: Enable and start the rootless Podman API socket
          ansible.builtin.systemd:
            scope: user
            name: podman.socket
            enabled: true
            state: started
            daemon_reload: true

        - name: Create dockhand data volume
          ansible.builtin.command: podman volume create --ignore dockhand_data
          changed_when: false

        - name: Create mgmt_tier network
          ansible.builtin.command: podman network create --ignore mgmt_tier
          changed_when: false

        - name: Get current dockhand image
          ansible.builtin.command: podman container inspect -f '{{ '{{' }}.ImageName{{ '}}' }}' dockhand
          register: dockhand_current
          changed_when: false
          failed_when: false

        - name: Remove dockhand container running a different image
          ansible.builtin.command: podman rm -f dockhand
          register: dockhand_removed
          when:
            - dockhand_current.rc == 0
            - dockhand_current.stdout | trim != dockhand_image

        - name: Create dockhand container
          ansible.builtin.command: >-
            podman run -d
            --name dockhand
            --restart=always
            --network=mgmt_tier
            -p 3000:3000
            -v "{{ podman_socket_path }}:/var/run/docker.sock"
            -v dockhand_data:/app/data
            --label=traefik.enable=true
            --label=traefik.docker.network=mgmt_tier
            --label=traefik.http.routers.dockhand.rule=Host(`{{ dockhand_domain }}`)
            --label=traefik.http.routers.dockhand.entrypoints=websecure
            --label=traefik.http.routers.dockhand.tls.certresolver=letsencrypt
            --label=traefik.http.routers.dockhand.tls=true
            "{{ dockhand_image }}"
          when: dockhand_current.rc != 0 or dockhand_removed is changed

        - name: Start dockhand if stopped
          ansible.builtin.command: podman start dockhand
          changed_when: false

    - name: Install system-level rootless Podman boot service
      ansible.builtin.copy:
        dest: /etc/systemd/system/podman-rootless-restart.service
        owner: root
        group: root
        mode: "0644"
        content: |
          [Unit]
          Description=Start rootless Podman containers with restart policy
          Wants=network-online.target
          After=network-online.target user@{{ podman_uid }}.service
          Requires=user@{{ podman_uid }}.service

          [Service]
          Type=oneshot
          RemainAfterExit=true
          TimeoutStartSec=150
          User={{ podman_user }}
          Environment=XDG_RUNTIME_DIR=/run/user/{{ podman_uid }}
          # pasta fails with "Couldn't set IPv4 route(s)" if started before a default route exists
          ExecStartPre=/usr/bin/timeout 60 /bin/sh -c 'until ip -4 route show default | grep -q .; do sleep 1; done'
          ExecStart=/bin/sh -c 'for attempt in 1 2 3 4 5 6; do /usr/bin/podman start --all --filter restart-policy=always && exit 0; /usr/bin/podman container cleanup --all >/dev/null 2>&1; sleep 10; done; exit 1'
          ExecStop=/usr/bin/podman stop --all --filter restart-policy=always

          [Install]
          WantedBy=multi-user.target

    - name: Enable and start system-level rootless Podman boot service
      ansible.builtin.systemd:
        name: podman-rootless-restart.service
        enabled: true
        state: started
        daemon_reload: true

    - name: Report dockhand URL
      ansible.builtin.debug:
        msg: "dockhand should be available at http://{{ ansible_host }}:3000"
